[package]
name = "k4p-core"
description = "Shared contract between the Kafka host and the PHP executor of kafka4php"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# Test helpers for other crates (`FakeExecutor`). Never enable in production builds.
testing = ["dep:tokio"]

[dependencies]
tokio = { workspace = true, features = ["time"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
