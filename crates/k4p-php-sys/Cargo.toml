[package]
name = "k4p-php-sys"
description = "C SAPI embedding PHP (ZTS) and raw FFI bindings for kafka4php"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
links = "php"

[dependencies]
k4p-core.workspace = true

[dev-dependencies]
k4p-core = { workspace = true, features = ["testing"] }
serde_json = "1"

[build-dependencies]
bindgen = { version = "0.72", default-features = false, features = ["runtime"] }
cc = "1"

# Each integration test binary owns its process: it initializes the PHP runtime once
# on the main thread and runs its cases sequentially on one PHP worker thread (see
# tests/common/mod.rs), so it uses its own harness instead of libtest's.
[[test]]
name = "sapi"
harness = false

[[test]]
name = "memory"
harness = false

[[test]]
name = "leaks"
harness = false

[[test]]
name = "opcache"
harness = false

[[test]]
name = "default_ini"
harness = false

# Per-request cost (PLAN.md S4): its own driver, one child process per row.
[[bench]]
name = "request_cost"
harness = false

[lints]
workspace = true
