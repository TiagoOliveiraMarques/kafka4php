[workspace]
resolver = "3"
members = [
    "crates/k4p-core",
    "crates/k4p-php-sys",
    "crates/k4p-php",
    "crates/k4p-host",
    "crates/kafka4php",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
k4p-core = { path = "crates/k4p-core" }
tokio = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
