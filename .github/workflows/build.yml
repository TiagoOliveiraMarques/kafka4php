# Builds the toolchain image (docker/dev.Dockerfile) for every supported PHP version.
# Green iff the image builds, which includes docker/php-check.sh verifying that the
# base image's PHP is ZTS + embed + max execution timers + OPcache.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build docker/dev.Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dev.Dockerfile
          build-args: PHP_VERSION=${{ matrix.php }}
          tags: kafka4php-dev:php${{ matrix.php }}
          push: false
          cache-from: type=gha,scope=dev-image-php${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=dev-image-php${{ matrix.php }}
