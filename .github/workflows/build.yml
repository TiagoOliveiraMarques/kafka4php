# Builds the toolchain image (docker/dev.Dockerfile) and runs the Rust checks and test
# suites inside it, for every supported PHP version (everything runs in the toolchain
# container, as locally with scripts/dev.sh):
#   build-and-test: image build (incl. docker/php-check.sh), cargo fmt --check, clippy
#                   -D warnings, cargo test --workspace --all-features.
#   leak-check:     the image with PHP_DEBUG=1 (ZTS debug PHP), running the k4p-php-sys
#                   request-memory leak check (crates/k4p-php-sys/tests/leak-check.sh).
#   php-framework:  the PHP framework (php/): PHPUnit + PHPStan on stock php:<ver>-cli
#                   via scripts/php-test.sh (no toolchain image).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build and test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    env:
      IMAGE: kafka4php-dev:php${{ matrix.php }}
      CARGO_CACHE: ${{ github.workspace }}/.ci-cargo-home
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build docker/dev.Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dev.Dockerfile
          build-args: PHP_VERSION=${{ matrix.php }}
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          cache-from: type=gha,scope=dev-image-php${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=dev-image-php${{ matrix.php }}

      - name: Cache cargo registry and target/
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_CACHE }}
            target
          key: cargo-php${{ matrix.php }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-php${{ matrix.php }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-php${{ matrix.php }}-

      - name: cargo fmt, clippy and test (in the toolchain image)
        run: |
          mkdir -p "$CARGO_CACHE/registry" "$CARGO_CACHE/git"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -v "$CARGO_CACHE/registry:/usr/local/cargo/registry" \
            -v "$CARGO_CACHE/git:/usr/local/cargo/git" \
            -e CARGO_TERM_COLOR=always \
            "$IMAGE" bash -euo pipefail -c '
              cargo fmt --all -- --check
              cargo clippy --workspace --all-targets --all-features -- -D warnings
              cargo test --workspace --all-features
            '

  leak-check:
    name: leak check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    env:
      IMAGE: kafka4php-dev:php${{ matrix.php }}-debug
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Same Dockerfile with PHP_DEBUG=1: every layer but the last is shared with the
      # build-and-test image, so its cache is read too.
      - name: Build docker/dev.Dockerfile (PHP_DEBUG=1)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dev.Dockerfile
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHP_DEBUG=1
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          cache-from: |
            type=gha,scope=dev-image-php${{ matrix.php }}-debug
            type=gha,scope=dev-image-php${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=dev-image-php${{ matrix.php }}-debug

      - name: crates/k4p-php-sys/tests/leak-check.sh (in the debug image)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e CARGO_TERM_COLOR=always \
            "$IMAGE" bash crates/k4p-php-sys/tests/leak-check.sh --in-container

  php-framework:
    name: php framework (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7

      - name: composer test and stan (scripts/php-test.sh, on php:${{ matrix.php }}-cli)
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: scripts/php-test.sh
